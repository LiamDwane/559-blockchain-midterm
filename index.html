<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <title>CryptoZombies front-end</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico">
  <script language="javascript" type="text/javascript"
    src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script language="javascript" type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/web3/1.2.7-rc.0/web3.min.js"></script>
  <script language="javascript" type="text/javascript" src="cryptozombies_abi.js"></script>
</head>

<body>
  <h1>CryptoZombies Demo Project</h1>
  <div class="subtitle">Demo web3 project using the CryptoZombies demo package</div>
  
  <div id="txStatus"><i>System status messages appear here.</i></div>
  <div id="zombies"></div>

  <button class="showZombieButton">Show Zombies</button>
  <button class="createzombieButton">Create Zombie</button>
  <button class="levelupButton">Level Up</button>

  <script>

    var cryptoZombies;
    var userAccount;
    const showZombieButton = document.querySelector('.showZombieButton');
    const createzombieButton = document.querySelector('.createzombieButton');
    const levelupButton = document.querySelector('.levelupButton');

    function startApp() {
	
      // Removed hard-coded cryptoZombiesAddress
	  // Address and ABI are automatically loaded from cryptozombies_abi.js
      cryptoZombies = new web3.eth.Contract(cryptoZombiesABI, cryptoZombiesAddress);

      cryptoZombies.events.Transfer({ filter: { _to: userAccount } })
        .on("data", function (event) {
          let data = event.returnValues;
          getZombiesByOwner(userAccount).then(displayZombies);
        }).on("error", console.error);
    }

    function displayZombies(ids) {
      $("#zombies").empty();
      if (ids.length === 0) {
        $("#zombies").html("<p style='color: var(--text-muted);'>No zombies found for this account.</p>");
        return;
      }
      for (id of ids) {
        getZombieDetails(id)
          .then(function (zombie) {
            let backLegColor = getPartColor(zombie.dna, 0, legBackCoefficients);
            let backArmColor = getPartColor(zombie.dna, 2, armCoefficients);
            let torsoColor = getPartColor(zombie.dna, 4, torsoCoefficients);
            let frontLegColor = getPartColor(zombie.dna, 6, legBackCoefficients);
            let frontArmColor = getPartColor(zombie.dna, 8, armCoefficients);
            let headColor = getPartColor(zombie.dna, 10, headCoefficients);

           $("#zombies").append(`<div class="zombie">
              <ul>
                <li><strong>Name:</strong> ${zombie.name}</li>
                <li><strong>DNA:</strong> ${zombie.dna}</li>
                <li><strong>Level:</strong> ${zombie.level}</li>
                <li><strong>Wins:</strong> ${zombie.winCount}</li>
                <li><strong>Losses:</strong> ${zombie.lossCount}</li>
                <li><strong>Ready Time:</strong> ${zombie.readyTime}</li>
              </ul>
              <div class="zombie-sprite-container">
                <canvas id="zombie-canvas-${id}" width="64" height="64"></canvas>
              </div>
            </div>`);
            drawZombieCanvas(id, {
              backLeg: backLegColor,
              backArm: backArmColor,
              torso: torsoColor,
              frontLeg: frontLegColor,
              frontArm: frontArmColor,
              head: headColor
            });
          });
      }
    }

    function cosineGradient(t, a, b, c, d) {
      let r = a[0] + b[0] * Math.cos(6.28318 * (c[0] * t + d[0]));
      let g = a[1] + b[1] * Math.cos(6.28318 * (c[1] * t + d[1]));
      let blue = a[2] + b[2] * Math.cos(6.28318 * (c[2] * t + d[2]));

      let redInt = Math.min(255, Math.max(0, Math.floor(r * 255)));
      let greenInt = Math.min(255, Math.max(0, Math.floor(g * 255)));
      let blueInt = Math.min(255, Math.max(0, Math.floor(blue * 255)));

      return `rgb(${redInt}, ${greenInt}, ${blueInt})`;
    }

    let legBackCoefficients = [
      [0.4, 0.5, 0.3],
      [0.4, 0.2, 0.15],
      [1, 1, 1],
      [0.0, 0.3, 0.5],
    ];

    let torsoCoefficients = [
      [0.2, 0.3, 0.2],
      [0.25, 0.25, 0.15],
      [1, 1.5, .7],
      [0.35, 0.5, 0.8],
    ];

    let armCoefficients = [
      [0.4, 0.5, 0.4],
      [0.3, 0.3, 0.2],
      [1.3, 1.2, .6],
      [0.0, 0.33, 0.67],
    ];

    let headCoefficients = [
      [0.4, 0.4, 0.3],
      [0.4, 0.6, 0.5],
      [2, 1.4, 1.5],
      [0.65, 0.55, 0.45],
    ];

    function getPartColor(dna, digitOffset, partCoefficients) {
      const divisor = 10n ** BigInt(digitOffset);
      const numericDna = Number((BigInt(dna) / divisor) % 100n);
      return cosineGradient(numericDna / 100, ...partCoefficients);
    }

    const spriteSources = {
      legBack: 'assets/559_Zombie_BW_Back_Leg.png',
      armBack: 'assets/559_Zombie_BW_Back_Arm.png',
      torso: 'assets/559_Zombie_BW_Torso.png',
      legFront: 'assets/559_Zombie_BW_Front_Leg.png',
      armFront: 'assets/559_Zombie_BW_Front_Arm.png',
      head: 'assets/559_Zombie_BW_Head.png'
    };

    const loadedSprites = {};
    let imagesLoaded = 0;
    const totalImages = Object.keys(spriteSources).length;

    for (let key in spriteSources) {
      let img = new Image();
      img.src = spriteSources[key];
      img.onload = () => {
        imagesLoaded++;
      };
      loadedSprites[key] = img;
    }
      
    function drawZombieCanvas(zombieId, colors) {
      const canvas = document.getElementById(`zombie-canvas-${zombieId}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      const frameWidth = 64, frameHeight = 64, totalFrames = 7;
      let currentFrame = 0, lastFrameTime = 0;

      const layers = [
        { img: loadedSprites.legBack,  color: colors.backLeg },
        { img: loadedSprites.armBack,  color: colors.backArm },
        { img: loadedSprites.torso,    color: colors.torso },
        { img: loadedSprites.legFront, color: colors.frontLeg },
        { img: loadedSprites.armFront, color: colors.frontArm },
        { img: loadedSprites.head,     color: colors.head }
      ];
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = frameWidth;
      tempCanvas.height = frameHeight;
      const tempCtx = tempCanvas.getContext('2d');

      function animate(timestamp) {
        if (!canvas.isConnected) return;
        if (imagesLoaded < totalImages) {
          requestAnimationFrame(animate);
          return;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const sx = currentFrame * frameWidth;

        for (const layer of layers) {
          tempCtx.globalCompositeOperation = 'source-over';
          tempCtx.clearRect(0, 0, frameWidth, frameHeight);

          tempCtx.drawImage(layer.img, sx, 0, frameWidth, frameHeight, 0, 0, frameWidth, frameHeight);

          tempCtx.globalCompositeOperation = 'multiply';
          tempCtx.fillStyle = layer.color;
          tempCtx.fillRect(0, 0, frameWidth, frameHeight);

          tempCtx.globalCompositeOperation = 'destination-in';
          tempCtx.drawImage(layer.img, sx, 0, frameWidth, frameHeight, 0, 0, frameWidth, frameHeight);

          ctx.drawImage(tempCanvas, 0, 0);
        }

        if (!lastFrameTime || timestamp - lastFrameTime > 240) {
          currentFrame = (currentFrame + 1) % totalFrames;
          lastFrameTime = timestamp;
        }
        requestAnimationFrame(animate);
      }

      requestAnimationFrame(animate);
    }    

    // Friendly status updates for creating a zombie.
    let zombieCreationPending = false;

    async function createRandomZombie(name) {
      if (zombieCreationPending) return;
      if (!cryptoZombies || !userAccount) {
        $("#txStatus").text("Connect MetaMask to your Ganache network first.");
        return;
      }

      zombieCreationPending = true;
      createzombieButton.disabled = true;
      try {
        $("#txStatus").text("Checking whether your account already has a zombie...");
        const ownedIds = await getZombiesByOwner(userAccount);
        if (ownedIds.length > 0) {
          $("#txStatus").text("You already own a zombie! Each wallet can create only one starter zombie. Use Show Zombies to view yours.");
          return;
        }

        $("#txStatus").text("Please confirm zombie creation in MetaMask...");
        const receipt = await cryptoZombies.methods.createRandomZombie(name)
          .send({ from: userAccount })
          .on("transactionHash", function () {
            $("#txStatus").text("Transaction submitted! Waiting for Ganache confirmation...");
          });

        if (receipt.status === false || receipt.status === '0x0') {
          throw new Error("Transaction reverted");
        }
        $("#txStatus").text("Zombie created successfully! Your zombie is displayed below.");
        const ids = await getZombiesByOwner(userAccount);
        displayZombies(ids);
      } catch (error) {
        console.error("Zombie creation failed:", error);
        const message = String(error && error.message || error);
        if (error && error.code === 4001 || /user denied|user rejected|rejected the request/i.test(message)) {
          $("#txStatus").text("Transaction cancelled in MetaMask. No zombie was created.");
        } else if (/revert|already known|execution reverted/i.test(message)) {
          $("#txStatus").text("Zombie creation was rejected. If you already own a zombie, click Show Zombies; otherwise check Ganache and try again.");
        } else {
          $("#txStatus").text("Could not create zombie. Check MetaMask, Ganache, and the browser console for details.");
        }
      } finally {
        zombieCreationPending = false;
        createzombieButton.disabled = false;
      }
    }

    function feedOnKitty(zombieId, kittyId) {
      $("#txStatus").text("Eating a kitty. This may take a while...");
      return cryptoZombies.methods.feedOnKitty(zombieId, kittyId)
        .send({ from: userAccount })
        .on("receipt", function (receipt) {
          $("#txStatus").text("Ate a kitty and spawned a new Zombie!");
          getZombiesByOwner(userAccount).then(displayZombies);
        })
        .on("error", function (error) {
          $("#txStatus").text(error);
        });
    }

    function levelUp(zombieId) {
      $("#txStatus").text("Leveling up your zombie...");
      return cryptoZombies.methods.levelUp(zombieId)
        .send({ from: userAccount, value: web3.utils.toWei("0.001", "ether") })
        .on("receipt", function (receipt) {
          $("#txStatus").text("Power overwhelming! Zombie successfully leveled up");
        })
        .on("error", function (error) {
          $("#txStatus").text(error);
        });
    }

    function getZombieDetails(id) {
      return cryptoZombies.methods.zombies(id).call()
    }

    function zombieToOwner(id) {
      return cryptoZombies.methods.zombieToOwner(id).call()
    }

    function getZombiesByOwner(owner) {
      return cryptoZombies.methods.getZombiesByOwner(owner).call()
    }

    window.addEventListener('load', async () => {
    // Modern dapp browsers...
    if (window.ethereum) {
        window.web3 = new Web3(ethereum);
        try {
            // Request account access if needed
            const accounts = await ethereum.enable();
            // Acccounts now exposed
            userAccount = accounts[0];
            startApp()
        } catch (error) {
            // User denied account access...
        }
    }
    // Legacy dapp browsers...
    else if (window.web3) {
        window.web3 = new Web3(web3.currentProvider);
        // Acccounts always exposed
        userAccount = web3.eth.accounts[0];
        startApp()
    }
    // Non-dapp browsers...
    else {
        console.log('Non-Ethereum browser detected. You should consider trying MetaMask!');
    }
   });
 
   //the following code from Lesson 6, chapter 2 is obsolete
   //metamask no longer inject web3 since early 2021
   //window.addEventListener('load', function () {

  //    if (typeof web3 !== 'undefined') {
   //     web3js = new Web3(web3.currentProvider);
   //   } else {

    //  }


    //  startApp()

  //  }) 

   ethereum.on('accountsChanged', (accounts) => {
       window.location.reload();
   });

   ethereum.on('chainChanged', (chainId) => {
       window.location.reload(); 
   });  

 
    createzombieButton.addEventListener('click', () => {
      createRandomZombie(userAccount);

    });

    showZombieButton.addEventListener('click', () => {
      getZombiesByOwner(userAccount)
            .then(displayZombies);

    });

    levelupButton.addEventListener('click', () => {
      getZombiesByOwner(userAccount)
            .then(levelUp);

    });



  </script>
</body>

</html>
